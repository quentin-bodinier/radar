<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title id="page-title">Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<script src="state/data.js"></script>
<style>
:root {
  /* Inato brand — warm neutral dark theme, orange/purple as accents only */
  --brand-primary: #ff6329;
  --brand-primary-glow: rgba(255, 99, 41, 0.15);
  --brand-primary-soft: rgba(255, 99, 41, 0.4);
  --brand-accent: #b250cd;
  --brand-accent-glow: rgba(178, 80, 205, 0.15);
  --brand-accent-soft: rgba(178, 80, 205, 0.4);
  --danger: #f17664;
  --danger-soft: rgba(241, 118, 100, 0.4);
  --warning: #ffab47;
  --tentative: #ffc146;
  --success: #25c354;
  --bg: #14100f;
  --surface: #1d1817;
  --surface2: #272220;
  --border: #3a3431;
  --text: #ede7e1;
  --text-muted: #9a9089;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 1200px; margin: 0 auto; padding: 24px 32px 48px; }

header {
  display: flex; justify-content: space-between; align-items: flex-end;
  padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px;
}
.header-left h1 { font-family: 'Lora', 'Times New Roman', serif; font-size: 26px; font-weight: 500; margin: 0; letter-spacing: -0.015em; }
.header-left .meta { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
.header-right { display: flex; gap: 10px; align-items: center; }
.header-right a, .header-right button {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border);
  padding: 6px 12px; border-radius: 20px;
  font-size: 12px; font-weight: 500;
  text-decoration: none; cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  font-family: inherit;
}
.header-right a:hover, .header-right button:hover { background: var(--surface2); border-color: var(--brand-accent); color: var(--brand-accent); }
.header-right button#refresh-btn:hover { color: var(--brand-primary); border-color: var(--brand-primary); }

.progress-wrap { margin-bottom: 20px; }
.progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.progress-bar-outer { height: 6px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.progress-bar-inner { height: 100%; background: var(--brand-accent); width: 0%; transition: width 0.3s; }

.focus-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
.focus-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 600; margin-right: 4px; padding-top: 4px; }
.focus-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 20px;
  font-size: 12px; font-weight: 500;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.focus-chip:hover { background: var(--bg); }
.focus-chip.urgent { border-color: var(--danger); }
.focus-chip.warning { border-color: var(--warning); }
.focus-chip.user-added {
  background: linear-gradient(180deg, var(--brand-accent-glow), rgba(178,80,205,0.04));
  border-color: var(--brand-accent);
  color: var(--text);
}
.focus-chip.user-added::before { content: "★"; color: var(--brand-accent); font-size: 11px; }

.done-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; min-height: 0; }
.done-chip { font-size: 11px; color: var(--text-muted); background: var(--surface); padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); text-decoration: line-through; }

.grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; }
.column { display: flex; flex-direction: column; gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.card-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; color: var(--text-muted); }
.badge { background: var(--surface2); color: var(--text); border: 1px solid var(--border); padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }

.timeline { display: flex; flex-direction: column; gap: 6px; position: relative; }
.now-line { position: absolute; left: 0; right: 0; height: 1px; background: var(--brand-primary); opacity: 0.6; pointer-events: none; }
.now-line::before { content: ""; position: absolute; left: 46px; top: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--brand-primary); box-shadow: 0 0 0 3px rgba(255,99,41,0.2); }
.event {
  display: flex; gap: 12px; padding: 8px 6px; border-radius: 8px; align-items: flex-start;
  transition: background 0.15s;
}
.event:hover { background: var(--surface2); }
.event-time { color: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; min-width: 52px; padding-top: 2px; font-weight: 500; }
.event-bar { width: 3px; align-self: stretch; background: var(--brand-accent); border-radius: 2px; min-height: 22px; flex-shrink: 0; }
.event.tentative .event-bar { background: var(--tentative); }
.event.declined .event-bar { background: var(--danger); opacity: 0.4; }
.event.past .event-bar { background: var(--text-muted); opacity: 0.5; }
.event.personal .event-bar { background: var(--text-muted); }
.event.async .event-bar { background: var(--brand-primary); opacity: 0.7; }
.event-body { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.event-title { font-size: 13px; font-weight: 500; color: var(--text); }
.event.declined .event-title, .event.past .event-title { color: var(--text-muted); text-decoration: line-through; }
.event-sub { font-size: 11px; color: var(--text-muted); }

.item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 6px; border-radius: 8px; transition: background 0.15s; }
.item:hover { background: var(--surface2); }
.item-check { margin-top: 3px; flex-shrink: 0; }
.item-check input { accent-color: var(--brand-accent); cursor: pointer; }
.item-body { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.item-title { font-size: 13px; font-weight: 500; line-height: 1.4; }
.item-sub { font-size: 11px; color: var(--text-muted); }
.item.done .item-title { text-decoration: line-through; color: var(--text-muted); }
.item-priority { font-size: 12px; flex-shrink: 0; margin-top: 2px; }

.commit-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 6px; border-radius: 8px; transition: background 0.15s; }
.commit-item:hover { background: var(--surface2); }
.commit-item.due-today .item-sub { color: var(--brand-primary); font-weight: 500; }
.commit-item.done .item-title { text-decoration: line-through; color: var(--text-muted); }

.carryover-badge {
  display: inline-flex; align-items: center;
  padding: 1px 7px; border-radius: 20px;
  font-size: 10px; font-weight: 500;
  background: var(--surface2);
  color: var(--text-muted);
  border: 1px solid var(--border);
  margin-left: 6px;
  vertical-align: middle;
  white-space: nowrap;
}
.carryover-badge.warm { color: var(--brand-primary); border-color: var(--brand-primary-soft); }
.carryover-badge.hot { color: var(--danger); border-color: var(--danger-soft); }
.new-badge {
  display: inline-flex; align-items: center;
  padding: 1px 7px; border-radius: 20px;
  font-size: 10px; font-weight: 500;
  color: var(--brand-accent);
  border: 1px solid var(--brand-accent-soft);
  margin-left: 6px;
  vertical-align: middle;
}

.user-focus-card {
  background: var(--surface);
  border: 1px solid var(--brand-accent);
  border-radius: 16px;
  padding: 16px 18px;
  margin-bottom: 20px;
  background-image: linear-gradient(180deg, var(--brand-accent-glow), transparent 60%);
}
.user-focus-card .card-title { color: var(--brand-accent); }
.user-focus-add-btn {
  background: transparent; color: var(--brand-accent);
  border: 1px solid var(--brand-accent);
  padding: 3px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 500;
  cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background 0.15s;
}
.user-focus-add-btn:hover { background: var(--brand-accent-glow); }
.user-focus-add-btn kbd {
  background: var(--surface2); border: 1px solid var(--border);
  padding: 0 5px; border-radius: 3px; font-size: 10px;
  font-family: inherit; color: var(--text-muted);
}
.user-focus-list { display: flex; flex-direction: column; gap: 2px; }
.user-focus-item { position: relative; }
.user-focus-item .item-title { font-weight: 500; }
.user-focus-empty {
  font-size: 12px; color: var(--text-muted); padding: 8px 6px; font-style: italic;
}
.user-focus-empty kbd {
  background: var(--surface2); border: 1px solid var(--border);
  padding: 1px 6px; border-radius: 4px; font-size: 11px; font-family: inherit;
  color: var(--text); font-style: normal;
}
.user-focus-delete {
  background: none; border: none; color: var(--text-muted);
  cursor: pointer; font-size: 18px; padding: 0 8px; line-height: 1;
  opacity: 0; transition: opacity 0.15s, color 0.15s;
  flex-shrink: 0; align-self: center;
}
.user-focus-item:hover .user-focus-delete { opacity: 0.6; }
.user-focus-delete:hover { opacity: 1 !important; color: var(--danger); }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: none; align-items: flex-start; justify-content: center;
  padding-top: 140px; z-index: 1000;
  backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; }
.modal-panel {
  background: var(--surface); border: 1px solid var(--brand-accent);
  border-radius: 16px; padding: 18px 20px; width: 520px; max-width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.modal-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--brand-accent); font-weight: 600; margin-bottom: 10px;
}
.modal-panel input {
  width: 100%; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; font-size: 14px; font-family: inherit;
  outline: none; transition: border-color 0.15s;
}
.modal-panel input:focus { border-color: var(--brand-accent); }
.modal-hint { font-size: 11px; color: var(--text-muted); margin-top: 10px; }
.modal-hint kbd {
  background: var(--surface2); border: 1px solid var(--border);
  padding: 0 5px; border-radius: 3px; font-size: 10px; font-family: inherit;
}

.tomorrow-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; border-left: 3px solid var(--success); }
.tomorrow-card .card-title { color: var(--success); }
.empty { color: var(--text-muted); font-size: 12px; font-style: italic; padding: 8px 6px; }

.item-source-link, .event-link {
  font-size: 11px;
  color: var(--text-muted);
  text-decoration: none;
  opacity: 0.5;
  margin-left: 6px;
  flex-shrink: 0;
  transition: opacity 0.15s;
}
.item-source-link:hover, .event-link:hover {
  opacity: 1;
  color: var(--brand-accent);
}

.event-actions {
  display: flex; align-items: center; gap: 6px;
  flex-shrink: 0; padding-top: 2px; align-self: center;
}
.event-join {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 20px;
  background: rgba(37, 195, 84, 0.12);
  color: var(--success);
  border: 1px solid rgba(37, 195, 84, 0.35);
  font-size: 11px; font-weight: 600;
  text-decoration: none; white-space: nowrap;
  font-family: inherit;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.event-join::before { content: "▶"; font-size: 8px; }
.event-join:hover { background: var(--success); color: var(--bg); border-color: var(--success); }
.event.past .event-join, .event.declined .event-join { opacity: 0.45; }

@media (max-width: 900px) {
  .grid { grid-template-columns: 1fr; }
  .container { padding: 16px; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-left">
      <h1 id="header-date">Radar</h1>
      <div class="meta" id="header-meta"></div>
    </div>
    <div class="header-right">
      <button id="refresh-btn" onclick="location.reload()">↻ Refresh</button>
    </div>
  </header>

  <div class="progress-wrap">
    <div class="progress-label">
      <span>Day progress</span>
      <span id="progress-text">0 of 0 done</span>
    </div>
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="progress-bar"></div></div>
  </div>

  <div class="focus-strip" id="focus-strip">
    <span class="focus-label">Focus →</span>
  </div>

  <div class="done-strip" id="done-strip"></div>

  <div class="user-focus-card" id="user-focus-card">
    <div class="card-header">
      <div class="card-title">My focus today</div>
      <div style="display:flex; gap:6px; align-items:center;">
        <button id="fs-connect-btn" class="user-focus-add-btn" onclick="connectFocusStorage()" title="Grant write access to ~/Documents/Radar/state/" style="display:none;">⚡ Connect</button>
        <span id="fs-status" class="user-focus-empty" style="padding:0; font-style:normal; font-size:11px;"></span>
        <button class="user-focus-add-btn" onclick="openUserFocusModal()" title="Press N to add">+ Add <kbd>N</kbd></button>
      </div>
    </div>
    <div class="user-focus-list" id="user-focus-list"></div>
  </div>

  <div id="radar-toast" style="position:fixed; bottom:24px; right:24px; background:var(--surface); color:var(--text); border:1px solid var(--brand-accent); border-radius:10px; padding:10px 16px; font-size:12px; box-shadow:0 8px 24px rgba(0,0,0,0.4); opacity:0; transform:translateY(8px); transition:opacity 0.2s, transform 0.2s; z-index:2000; max-width:340px; pointer-events:none;"></div>

  <div class="grid">
    <div class="column">

      <div class="card">
        <div class="card-header">
          <div class="card-title">Today's Calendar</div>
          <div class="badge" id="calendar-badge">—</div>
        </div>
        <div class="timeline" id="timeline"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Open commitments</div>
          <div class="badge" id="commitments-badge">—</div>
        </div>
        <div id="commitments-list"></div>
      </div>

    </div>

    <div class="column">

      <div class="card">
        <div class="card-header">
          <div class="card-title">Slack — awaiting reply</div>
          <div class="badge" id="slack-badge">—</div>
        </div>
        <div id="slack-list"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Gmail — action items</div>
          <div class="badge" id="gmail-badge">—</div>
        </div>
        <div id="gmail-list"></div>
      </div>

      <div class="tomorrow-card">
        <div class="card-header">
          <div class="card-title">Tomorrow — <span id="tomorrow-date"></span></div>
          <div class="badge" id="tomorrow-badge">—</div>
        </div>
        <div id="tomorrow-list"></div>
      </div>

    </div>
  </div>
</div>

<div id="user-focus-modal" class="modal-overlay" onclick="if(event.target===this)closeUserFocusModal()">
  <div class="modal-panel">
    <div class="modal-label">New focus task</div>
    <input type="text" id="user-focus-input" placeholder="What do you proactively choose to focus on?" maxlength="120" autocomplete="off">
    <div class="modal-hint"><kbd>Enter</kbd> to add · <kbd>Esc</kbd> to cancel</div>
  </div>
</div>

<script>
const STORAGE_KEY = 'radar-today-' + (window.RADAR_DATA?.isoDate || new Date().toISOString().slice(0,10));
const USER_FOCUS_KEY = 'radar-user-focus-tasks';
const FS_DB_NAME = 'radar-fs';
const FS_STORE = 'handles';
const FS_KEY = 'stateDir';
let fsDirHandle = null;

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { return {}; }
}
function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function handleCheck(el) {
  const key = el.dataset.key;
  if (key && (key.startsWith('uf-') || key.startsWith('focus-'))) {
    toggleUserFocusTask(key, el.checked);
    const parent = el.closest('.user-focus-item');
    if (parent) parent.classList.toggle('done', el.checked);
    renderUserFocus();
    updateDoneStrip();
    updateProgress();
    return;
  }
  const state = loadState();
  state[key] = el.checked;
  saveState(state);
  const parent = el.closest('.item, .commit-item');
  if (parent) parent.classList.toggle('done', el.checked);
  updateDoneStrip();
  updateProgress();
  updateFocusChips();
}

function restoreState() {
  const state = loadState();
  document.querySelectorAll('input[type="checkbox"][data-key]').forEach(el => {
    const key = el.dataset.key;
    if (key && key.startsWith('uf-')) return;
    if (state[key]) {
      el.checked = true;
      const parent = el.closest('.item, .commit-item');
      if (parent) parent.classList.add('done');
    }
  });
  updateFocusChips();
}

function scrollToItem(id) {
  const el = document.getElementById(id);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.style.transition = 'background 0.3s';
    el.style.background = 'var(--surface2)';
    setTimeout(() => { el.style.background = ''; }, 1400);
  }
}

function updateFocusChips() {
  document.querySelectorAll('.focus-chip:not(.user-added)').forEach(chip => {
    const match = (chip.getAttribute('onclick') || '').match(/scrollToItem\('([^']+)'\)/);
    if (!match) return;
    const target = document.getElementById(match[1]);
    if (!target) return;
    chip.style.display = target.classList.contains('done') ? 'none' : '';
  });
}

function updateDoneStrip() {
  const strip = document.getElementById('done-strip');
  if (!strip) return;
  strip.innerHTML = '';
  document.querySelectorAll('.item.done, .commit-item.done, .user-focus-item.done').forEach(el => {
    const title = el.querySelector('.item-title');
    if (!title) return;
    const chip = document.createElement('span');
    chip.className = 'done-chip';
    const t = (title.childNodes[0] ? title.childNodes[0].textContent : title.textContent).trim();
    chip.textContent = t.length > 60 ? t.slice(0, 60) + '…' : t;
    strip.appendChild(chip);
  });
}

function updateProgress() {
  const boxes = document.querySelectorAll('input[type="checkbox"][data-key]');
  const done = document.querySelectorAll('input[type="checkbox"][data-key]:checked');
  const total = boxes.length;
  const count = done.length;
  const pct = total ? (count / total) * 100 : 0;
  const bar = document.getElementById('progress-bar');
  const txt = document.getElementById('progress-text');
  if (bar) bar.style.width = pct + '%';
  if (txt) txt.textContent = count + ' of ' + total + ' done';
}

function placeNowLine() {
  const timeline = document.getElementById('timeline');
  if (!timeline) return;
  const events = Array.from(timeline.querySelectorAll('.event'));
  if (!events.length) return;
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  let insertBefore = null;
  for (const ev of events) {
    const t = ev.getAttribute('data-time');
    if (!t) continue;
    const [h, m] = t.split(':').map(Number);
    const eventMin = h * 60 + m;
    if (eventMin > nowMin) { insertBefore = ev; break; }
  }
  const line = document.createElement('div');
  line.className = 'now-line';
  if (insertBefore) {
    const rect = insertBefore.getBoundingClientRect();
    const tlRect = timeline.getBoundingClientRect();
    line.style.top = (rect.top - tlRect.top - 4) + 'px';
  } else {
    line.style.bottom = '-4px';
  }
  timeline.appendChild(line);
}

// ----- File System Access bridge to focus.json -----

function fsOpenDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(FS_DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(FS_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function fsGetStored() {
  try {
    const db = await fsOpenDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(FS_STORE, 'readonly');
      const r = tx.objectStore(FS_STORE).get(FS_KEY);
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => reject(r.error);
    });
  } catch(e) { return null; }
}
async function fsStore(handle) {
  const db = await fsOpenDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(FS_STORE, 'readwrite');
    tx.objectStore(FS_STORE).put(handle, FS_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function fsClear() {
  const db = await fsOpenDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(FS_STORE, 'readwrite');
    tx.objectStore(FS_STORE).delete(FS_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function fsEnsureDir({ prompt = false } = {}) {
  if (!window.showDirectoryPicker) throw new Error('Browser missing File System Access API. Use Chrome or Edge.');
  if (!prompt && fsDirHandle) {
    const p = await fsDirHandle.queryPermission({ mode: 'readwrite' });
    if (p === 'granted') return fsDirHandle;
  }
  if (!prompt) {
    const stored = await fsGetStored();
    if (stored) {
      const p = await stored.queryPermission({ mode: 'readwrite' });
      if (p === 'granted') { fsDirHandle = stored; return stored; }
      const r = await stored.requestPermission({ mode: 'readwrite' });
      if (r === 'granted') { fsDirHandle = stored; return stored; }
    }
  }
  const handle = await window.showDirectoryPicker({ id: 'radar-state-dir', mode: 'readwrite', startIn: 'documents' });
  try { await handle.getFileHandle('focus.json'); }
  catch(e) { throw new Error('Selected folder must contain focus.json. Pick ~/Documents/Radar/state/'); }
  await fsStore(handle);
  fsDirHandle = handle;
  return handle;
}
async function fsReadFocus() {
  const dir = await fsEnsureDir();
  const fh = await dir.getFileHandle('focus.json');
  const f = await fh.getFile();
  return JSON.parse(await f.text());
}
async function fsWriteFocus(data) {
  const dir = await fsEnsureDir();
  const fh = await dir.getFileHandle('focus.json');
  const w = await fh.createWritable();
  await w.write(JSON.stringify(data, null, 2));
  await w.close();
}

function nowIsoTZ() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const off = -d.getTimezoneOffset();
  const sign = off >= 0 ? '+' : '-';
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${sign}${pad(Math.floor(Math.abs(off)/60))}:${pad(Math.abs(off)%60)}`;
}
function genFocusId() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `focus-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}

function isTaskDone(t) {
  if (!t) return false;
  if ('active' in t) return t.active === false;
  return t.completed === true;
}

// Convert legacy uf-* localStorage shape → focus.json shape
function legacyToFocus(t) {
  return {
    id: t.id && t.id.startsWith('focus-') ? t.id : genFocusId(),
    title: t.title,
    added_at: t.added_at || t.created_at || nowIsoTZ(),
    active: 'active' in t ? t.active : !isTaskDone(t),
    completed_at: t.completed_at || null
  };
}

let toastTimer = null;
function showToast(msg, kind = 'info') {
  const el = document.getElementById('radar-toast');
  if (!el) return;
  el.textContent = msg;
  el.style.borderColor = kind === 'error' ? 'var(--danger)' : 'var(--brand-accent)';
  el.style.opacity = '1';
  el.style.transform = 'translateY(0)';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
  }, kind === 'error' ? 6000 : 3000);
}

function setFsStatus() {
  const status = document.getElementById('fs-status');
  const btn = document.getElementById('fs-connect-btn');
  if (!status || !btn) return;
  if (fsDirHandle) {
    status.textContent = '✓ synced';
    status.style.color = 'var(--success)';
    btn.style.display = 'none';
  } else {
    status.textContent = '⚠ local-only';
    status.style.color = 'var(--warning)';
    btn.style.display = 'inline-flex';
  }
}

// User-facing: triggered by Connect button
async function connectFocusStorage() {
  try {
    await fsEnsureDir({ prompt: true });
    // Migrate any legacy localStorage tasks into focus.json
    const cache = loadUserFocusTasks();
    const focus = await fsReadFocus();
    focus.tasks = focus.tasks || [];
    const existingTitles = new Set(focus.tasks.map(t => t.title.trim().toLowerCase()));
    let migrated = 0;
    for (const t of (cache.tasks || [])) {
      const title = (t.title || '').trim();
      if (!title || existingTitles.has(title.toLowerCase())) continue;
      focus.tasks.push(legacyToFocus(t));
      migrated++;
    }
    if (migrated > 0) await fsWriteFocus(focus);
    // Replace cache with focus.json contents (canonical going forward)
    saveUserFocusTasks({ version: 1, tasks: focus.tasks });
    setFsStatus();
    renderUserFocus();
    updateProgress();
    updateDoneStrip();
    showToast(migrated > 0 ? `Connected. Migrated ${migrated} task(s) to focus.json.` : 'Connected to focus.json.');
  } catch(e) {
    showToast('Connect failed: ' + e.message, 'error');
  }
}

// ----- User focus tasks (press N to add) -----

function loadUserFocusTasks() {
  try {
    const raw = localStorage.getItem(USER_FOCUS_KEY);
    if (!raw) return { version: 1, tasks: [] };
    const data = JSON.parse(raw);
    if (!data.tasks) data.tasks = [];
    return data;
  } catch(e) { return { version: 1, tasks: [] }; }
}
function saveUserFocusTasks(data) {
  try { localStorage.setItem(USER_FOCUS_KEY, JSON.stringify(data)); } catch(e) {}
}
function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function daysSince(dateStr) {
  if (!dateStr) return 0;
  const [y,m,d] = dateStr.split('-').map(Number);
  const then = new Date(y, m-1, d);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((today - then) / 86400000);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function addUserFocusTask(title) {
  title = (title || '').trim();
  if (!title) return;
  const newTask = {
    id: genFocusId(),
    title,
    added_at: nowIsoTZ(),
    active: true,
    completed_at: null
  };
  // Optimistic local cache update for instant UX
  const cache = loadUserFocusTasks();
  cache.tasks = cache.tasks || [];
  cache.tasks.push(newTask);
  saveUserFocusTasks(cache);
  renderUserFocus();
  updateProgress();
  updateDoneStrip();
  // Write-through to focus.json
  try {
    const focus = await fsReadFocus();
    focus.tasks = focus.tasks || [];
    focus.tasks.push(newTask);
    await fsWriteFocus(focus);
    showToast('Added to focus.json — visible to /radar-act');
  } catch(e) {
    showToast('Saved locally only. Click ⚡ Connect to sync to focus.json.', 'error');
  }
}

async function toggleUserFocusTask(id, checked) {
  const cache = loadUserFocusTasks();
  const t = (cache.tasks || []).find(x => x.id === id);
  if (!t) return;
  t.active = !checked;
  t.completed_at = checked ? nowIsoTZ() : null;
  // legacy field kept for back-compat with any old uf-* entries
  t.completed = checked;
  saveUserFocusTasks(cache);
  try {
    const focus = await fsReadFocus();
    const ft = (focus.tasks || []).find(x => x.id === id);
    if (ft) {
      ft.active = !checked;
      ft.completed_at = t.completed_at;
      await fsWriteFocus(focus);
    }
  } catch(e) { /* offline — local-only */ }
}

async function deleteUserFocusTask(id) {
  const cache = loadUserFocusTasks();
  cache.tasks = (cache.tasks || []).filter(x => x.id !== id);
  saveUserFocusTasks(cache);
  renderUserFocus();
  updateProgress();
  updateDoneStrip();
  try {
    const focus = await fsReadFocus();
    focus.tasks = (focus.tasks || []).filter(x => x.id !== id);
    await fsWriteFocus(focus);
  } catch(e) { /* offline — local-only */ }
}

function pruneUserFocusTasks() {
  const data = loadUserFocusTasks();
  const today = todayISO();
  const before = data.tasks.length;
  data.tasks = data.tasks.filter(t => {
    if (!isTaskDone(t)) return true;
    if (!t.completed_at) return true;
    return t.completed_at.slice(0, 10) === today;
  });
  if (data.tasks.length !== before) saveUserFocusTasks(data);
}

function renderUserFocus() {
  pruneUserFocusTasks();
  const list = document.getElementById('user-focus-list');
  if (!list) return;
  const data = loadUserFocusTasks();
  const tasks = data.tasks.slice().sort((a, b) => {
    const ad = isTaskDone(a), bd = isTaskDone(b);
    if (ad !== bd) return ad ? 1 : -1;
    const aAdded = a.added_at || a.created_at || '';
    const bAdded = b.added_at || b.created_at || '';
    return aAdded.localeCompare(bAdded);
  });

  list.innerHTML = '';
  if (tasks.length === 0) {
    list.innerHTML = '<div class="user-focus-empty">Press <kbd>N</kbd> to add a focus task — what you <em>choose</em> to work on, not what\'s reacting to notifications.</div>';
  } else {
    tasks.forEach(t => {
      const dayBucket = (t.added_at || t.created_at || '').slice(0, 10);
      const days = daysSince(dayBucket);
      const badgeClass = days >= 3 ? 'hot' : (days >= 1 ? 'warm' : '');
      const badge = days > 0 ? `<span class="carryover-badge ${badgeClass}">day ${days+1}</span>` : '';
      const item = document.createElement('div');
      item.className = 'user-focus-item item' + (isTaskDone(t) ? ' done' : '');
      item.id = t.id;
      item.innerHTML =
        '<div class="item-check"><input type="checkbox" data-key="' + t.id + '"' + (isTaskDone(t) ? ' checked' : '') + ' onchange="handleCheck(this)"></div>' +
        '<div class="item-body"><div class="item-title">' + escapeHtml(t.title) + badge + '</div></div>' +
        '<button class="user-focus-delete" onclick="deleteUserFocusTask(\'' + t.id + '\')" title="Remove">×</button>';
      list.appendChild(item);
    });
  }

  const strip = document.getElementById('focus-strip');
  if (strip) {
    strip.querySelectorAll('.focus-chip.user-added').forEach(c => c.remove());
    const label = strip.querySelector('.focus-label');
    tasks.filter(t => !isTaskDone(t)).slice(0, 6).reverse().forEach(t => {
      const chip = document.createElement('span');
      chip.className = 'focus-chip user-added';
      chip.onclick = () => scrollToItem(t.id);
      const text = t.title.length > 50 ? t.title.slice(0, 50) + '…' : t.title;
      chip.textContent = text;
      if (label && label.nextSibling) {
        strip.insertBefore(chip, label.nextSibling);
      } else {
        strip.appendChild(chip);
      }
    });
  }
}

let userFocusModalOpen = false;
function openUserFocusModal() {
  if (userFocusModalOpen) return;
  userFocusModalOpen = true;
  const overlay = document.getElementById('user-focus-modal');
  const input = document.getElementById('user-focus-input');
  if (!overlay || !input) return;
  overlay.classList.add('open');
  input.value = '';
  setTimeout(() => input.focus(), 10);
}
function closeUserFocusModal() {
  userFocusModalOpen = false;
  const overlay = document.getElementById('user-focus-modal');
  if (overlay) overlay.classList.remove('open');
}
function submitUserFocus() {
  const input = document.getElementById('user-focus-input');
  if (!input) return;
  const val = input.value.trim();
  if (val) addUserFocusTask(val);
  closeUserFocusModal();
}

document.addEventListener('keydown', (e) => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  const inField = ['INPUT', 'TEXTAREA', 'SELECT'].includes(tag);
  if (userFocusModalOpen) {
    if (e.key === 'Escape') { e.preventDefault(); closeUserFocusModal(); }
    else if (e.key === 'Enter') { e.preventDefault(); submitUserFocus(); }
    return;
  }
  if ((e.key === 'n' || e.key === 'N') && !inField && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    openUserFocusModal();
  }
});

async function tryAutoRestoreFsHandle() {
  try {
    const stored = await fsGetStored();
    if (!stored) return;
    const p = await stored.queryPermission({ mode: 'readwrite' });
    if (p === 'granted') {
      fsDirHandle = stored;
      // Refresh local cache from disk so we show the latest focus.json
      try {
        const focus = await fsReadFocus();
        saveUserFocusTasks({ version: 1, tasks: focus.tasks || [] });
        renderUserFocus();
        updateProgress();
        updateDoneStrip();
      } catch(e) { /* ignore */ }
    }
  } catch(e) { /* ignore */ }
}

function applyRadarData() {
  if (!window.RADAR_DATA) return;
  const d = window.RADAR_DATA;
  if (d.headerDate) {
    document.getElementById('page-title').textContent = 'Radar \u2014 ' + d.headerDate;
    document.getElementById('header-date').textContent = d.headerDate;
  }
  if (d.headerMeta) document.getElementById('header-meta').textContent = d.headerMeta;
  if (d.autoFocusChipsHtml) {
    const strip = document.getElementById('focus-strip');
    const label = strip && strip.querySelector('.focus-label');
    if (label) label.insertAdjacentHTML('afterend', d.autoFocusChipsHtml);
  }
  const calBadge = document.getElementById('calendar-badge');
  if (calBadge && d.calendarCount !== undefined) calBadge.textContent = d.calendarCount + ' events';
  const timeline = document.getElementById('timeline');
  if (timeline && d.calendarEventsHtml !== undefined) timeline.innerHTML = d.calendarEventsHtml;
  const commitBadge = document.getElementById('commitments-badge');
  if (commitBadge && d.commitmentsCount !== undefined) commitBadge.textContent = d.commitmentsCount + ' open';
  const commitList = document.getElementById('commitments-list');
  if (commitList && d.commitmentItemsHtml !== undefined) commitList.innerHTML = d.commitmentItemsHtml;
  const slackBadge = document.getElementById('slack-badge');
  if (slackBadge && d.slackBadge !== undefined) slackBadge.textContent = d.slackBadge;
  const slackList = document.getElementById('slack-list');
  if (slackList && d.slackItemsHtml !== undefined) slackList.innerHTML = d.slackItemsHtml;
  const gmailBadge = document.getElementById('gmail-badge');
  if (gmailBadge && d.gmailCount !== undefined) gmailBadge.textContent = d.gmailCount + ' open';
  const gmailList = document.getElementById('gmail-list');
  if (gmailList && d.gmailItemsHtml !== undefined) gmailList.innerHTML = d.gmailItemsHtml;
  const tomorrowDate = document.getElementById('tomorrow-date');
  if (tomorrowDate && d.tomorrowDate) tomorrowDate.textContent = d.tomorrowDate;
  const tomorrowBadge = document.getElementById('tomorrow-badge');
  if (tomorrowBadge && d.tomorrowBadge) tomorrowBadge.textContent = d.tomorrowBadge;
  const tomorrowList = document.getElementById('tomorrow-list');
  if (tomorrowList && d.tomorrowItemsHtml !== undefined) tomorrowList.innerHTML = d.tomorrowItemsHtml;
}

document.addEventListener('DOMContentLoaded', () => {
  applyRadarData();
  renderUserFocus();
  restoreState();
  updateDoneStrip();
  updateProgress();
  placeNowLine();
  setFsStatus();
  tryAutoRestoreFsHandle().then(setFsStatus);
});
</script>
